<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>
</head>
<body>
    {% if user %}
        <div>
            {% if user.profile_picture %}
                <img src="{{ user.profile_picture.url }}" alt="Profile Picture" width="100" height="100">
            {% else %}
                <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Profile Picture" width="100" height="100">
            {% endif %}
            <p>Username: {{user.username}}</p>
            <p>Bio: {{user.bio}}</p>
            <p>Followers: {{user.follower}}</p>
            <p>Following: {{user.following}}</p>
        </div>
    {% else %}
        <div>
            <p>User not found</p>
        </div>
    {% endif %}
</body>
</html>
