<!DOCTYPE html>
<html>
<head>
    <title>Change password</title>
</head>
<body>
    <h1> {{user.username}}</h1>
    <form method='POST'>
        {% csrf_token %}
        {{form.as_p}}
        <input type="submit" value="Change password"/>          
    </form>
    <input type="button" value="Back" onclick="window.location.href='/user/{{user.username}}'"/>
    {% if error %}
        <p>{{error}}</p>
    {% endif %}
</body>
</html>
